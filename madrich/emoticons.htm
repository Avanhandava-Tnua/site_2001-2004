	<script language="JavaScript">
	<!-- Begin
	var h=0,e=0,n=0,m=0;
	var hChose="", eChose=":", nChose="-", mChose=")";
	document.write("<FORM NAME=\"theForm\"><CENTER>"
	+ "<input type=text size=20 name=face>"
	+"<BR><br><input type=button value=Cabelo onClick='changeHair()'>"
	+"<input type=button value=Olhos onClick='changeEyes()'>"
	+"<input type=button value=Nariz onClick='changeNose()'>"
	+"<input type=button value=Boca onClick='changeMouth()'>  ");
	document.write("<input type=button value=Visualizar onClick='viewIt()'>");
	document.write("</CENTER></FORM>");
	document.theForm.face.value=hChose+" "+eChose+" "+nChose+mChose;
	hair=new Array("","[[[","2","3","(","\\/\\/","Ç","@@@","@","§","@-[");
	eyes=new Array("B",":\'",">:","<:",":",";","¦");
	nose=new Array("- ","^ ","* ","~ ","¤ ","");
	mouth=new Array("Þ","O","}","|",")","(",")~~",")===",")K");
	function changeHair() {
	if (h == 10) {h=0} else (h++)
	hChose = hair[h];
	document.theForm.face.value=hChose+" "+eChose+" "+nChose+mChose;
	}
	function changeEyes() {
	if (e == 6) {e=0} else (e++)
	eChose = eyes[e];
	document.theForm.face.value=hChose+" "+eChose+" "+nChose+mChose;
	}
	function changeNose() {
	if (n == 5) {n=0} else (n++)
	nChose = nose[n];
	document.theForm.face.value=hChose+" "+eChose+" "+nChose+mChose;
	}
	function changeMouth() {
	if (m == 8) {m=0} else (m++)
	mChose = mouth[m];
	document.theForm.face.value=hChose+" "+eChose+" "+nChose+mChose;
	}
	function viewIt() {
	mth="";
	for (i=1;i<=mChose.length;i++) {mth += mChose.charAt(i)}
	see=window.open('','','width=370,height=175,toolbar=no,status=no,scrolling=no');
	see.document.write("<HTML><HEAD><TITLE>E-Cara de Batata</TITLE></HEAD><BODY>"
	+ "<CENTER><FONT SIZE=7><B>"+hChose+" <FONT COLOR=blue>"
	+ eChose + " </FONT>" + nChose + " <FONT COLOR=red>" 
	+ mChose.charAt(0) + "</FONT>" + mth + "</B></FONT><br><br>"
	+ "<FONT SIZE=2 FACE=VERDANA, ARIAL><b>E-Cara de Batata (emoticons)</b></FONT><br>"
	+ "<FONT SIZE=2 FACE=VERDANA, ARIAL><b>Avanhandava</b></FONT><br>"
	+ "<FONT SIZE=-2 FACE=VERDANA, ARIAL>(<a href=\"javascript:this.close()\">"
	+ "close.window</a>)</FONT></CENTER></BODY></HTML>");
	}
	// End -->
	</script>
