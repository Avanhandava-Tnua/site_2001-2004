<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avanhandava 2004 — 800×600</title>
<style>
  :root {
    --bg: #1b1d21;
    --panel: #2a2d33;
    --ink: #e8e6e1;
    --muted: #9aa0a8;
    --edge: #3a3e45;
  }
  :root:not([data-theme="dark"]) {
    @media (prefers-color-scheme: light) {}
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 12px;
  }
  header { text-align: center; max-width: 820px; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .01em; }
  header p { margin: 0; color: var(--muted); font-size: .84rem; }
  .bezel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    /* the whole rig scales down on small screens; the iframe stays 800x600 */
    transform-origin: top center;
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    font-size: .75rem; color: var(--muted);
    padding: 0 2px 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555a61; }
  iframe {
    display: block;
    width: 800px; height: 600px;
    border: 0; background: #fff;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, a.btn {
    font: inherit; font-size: .82rem;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 11px; cursor: pointer; text-decoration: none;
  }
  button[aria-pressed="true"] { background: #3d4149; border-color: #555a61; }
  footer { color: var(--muted); font-size: .75rem; max-width: 820px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Avanhandava.org, como era em 2004</h1>
  <p>800×600 — a resolução para a qual o site foi desenhado.</p>
</header>

<div class="controls">
  <button id="s100" aria-pressed="true">100%</button>
  <button id="sfit" aria-pressed="false">Ajustar à janela</button>
  <a class="btn" href="frame.htm">Abrir em tela cheia</a>
  <a class="btn" href="index.html">Intro em Flash</a>
</div>

<div class="bezel" id="bezel">
  <div class="titlebar"><span class="dot"></span><span>avanhandava.org — 800 × 600</span></div>
  <iframe id="screen" src="frame.htm" title="avanhandava.org"></iframe>
</div>

<footer>
  O conteúdo dentro da moldura é o site original. A moldura e os controles não
  fazem parte dele.
</footer>

<script>
  var bezel = document.getElementById('bezel');
  var b100 = document.getElementById('s100');
  var bfit = document.getElementById('sfit');
  var mode = 'fit';

  function apply() {
    if (mode === '100') {
      bezel.style.transform = 'scale(1)';
      bezel.style.marginBottom = '0px';
    } else {
      // 820 = 800px screen + 2x10px padding
      var scale = Math.min(1, (window.innerWidth - 32) / 822);
      bezel.style.transform = 'scale(' + scale + ')';
      // reclaim the space the transform leaves behind
      bezel.style.marginBottom = -(1 - scale) * bezel.offsetHeight + 'px';
    }
    b100.setAttribute('aria-pressed', mode === '100');
    bfit.setAttribute('aria-pressed', mode === 'fit');
  }

  b100.onclick = function () { mode = '100'; apply(); };
  bfit.onclick = function () { mode = 'fit'; apply(); };
  window.addEventListener('resize', apply);
  apply();
</script>

</body>
</html>
